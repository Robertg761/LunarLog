name: Release

on:
  push:
    branches: [ main ]
    paths:
      - "app/build.gradle.kts"
      - "CHANGELOG.md"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read Version
        id: ver
        run: node scripts/get_version.js

      - name: Skip If Release Already Exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.ver.outputs.version_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for $TAG; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Keystore
        if: steps.exists.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LL_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "Missing secret LL_KEYSTORE_B64."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lunarlog_keystore.jks"
          echo "LL_SIGNING_STORE_FILE=$RUNNER_TEMP/lunarlog_keystore.jks" >> "$GITHUB_ENV"
          # Your keystore is PKCS12 (even if the file extension is .jks).
          echo "LL_SIGNING_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        if: steps.exists.outputs.skip != 'true'
        env:
          LL_SIGNING_STORE_PASSWORD: ${{ secrets.LL_SIGNING_STORE_PASSWORD }}
          LL_SIGNING_KEY_ALIAS: ${{ secrets.LL_SIGNING_KEY_ALIAS }}
          LL_SIGNING_KEY_PASSWORD: ${{ secrets.LL_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease

      - name: Prepare Dist
        if: steps.exists.outputs.skip != 'true'
        id: dist
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version_name }}"
          mkdir -p dist

          APK_PATH="$(ls -1 app/build/outputs/apk/release/*.apk | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Could not locate release APK under app/build/outputs/apk/release/"
            exit 1
          fi

          OUT_APK="dist/LunarLog-${VERSION}.apk"
          cp "$APK_PATH" "$OUT_APK"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Extract Release Notes
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/extract_changelog_section.js "${{ steps.ver.outputs.version_name }}" > dist/release-notes.md

      - name: Create GitHub Release
        if: steps.exists.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: v${{ steps.ver.outputs.version_name }}
          body_path: dist/release-notes.md
          files: ${{ steps.dist.outputs.apk_path }}
          draft: false
          prerelease: false
